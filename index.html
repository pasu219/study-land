<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學探險島</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff5e5;color:#24334b;font:18px/1.65 -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif}main{max-width:720px;margin:auto;padding:16px}header{background:#233e70;color:white;padding:22px;border-radius:24px}h1{font-size:30px;margin:0}h2{font-size:24px;margin:0 0 10px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:2px solid #9ebce5;background:white;color:#233e70;border-radius:16px;padding:12px;margin:4px;min-height:48px}nav{display:flex;flex-wrap:wrap;margin:12px 0}nav button{flex:1 1 28%;font-size:16px}.active,.primary{background:#2457a5;color:white}.panel{background:white;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 4px 16px #73552a15}.visual{background:#e9f5ff;border-radius:18px;padding:16px;text-align:center;margin:12px 0}.big{font-size:clamp(23px,6vw,34px);font-weight:800}.items{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.item{background:white;border:2px solid #9ebce5;border-radius:12px;padding:8px;min-width:58px}.hint{background:#fff0ba;padding:12px;border-radius:12px}.good{color:#086943}.bad{color:#a93622}.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px}.grid{display:grid;gap:3px;width:min(180px,100%);margin:12px auto}.grid i{aspect-ratio:1;background:#9b7bdf;border-radius:3px}progress{width:100%;accent-color:#ffcf59}.tag{background:#def5d9;padding:4px 10px;border-radius:20px;font-size:15px;display:inline-block}.dot{position:relative;display:inline-block}.dot:before{content:'•';position:absolute;top:-.6em;left:0;width:100%;text-align:center;color:#b12654}footer{font-size:14px}button:disabled{opacity:.4}
</style><main><header><small>🐱 數學探險隊</small><h1>數學探險島 🏝️</h1><div>睇圖 → 諗一諗 → 闖關</div><div id="score"></div><progress id="progress" max="30" value="0"></progress></header><nav id="nav"></nav><section class="panel" id="lesson"></section><section class="panel" id="quiz"></section><footer>每次玩一關就可以休息。語音視乎裝置支援；星星只儲存在本機瀏覽器，不會上傳。</footer></main><script>
const $=id=>document.getElementById(id);
const items=(n,s)=>'<div class="items">'+Array.from({length:n},()=>'<span class="item">'+s+'</span>').join('')+'</div>';
const grid=n=>'<div class="grid" style="grid-template-columns:repeat('+n+',1fr)">'+'<i></i>'.repeat(n*n)+'</div>';
const lessons=[
{title:'小數乘法',icon:'🍫',steps:[['先睇圖：0.4 × 0.2','<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:220px;margin:auto">'+Array.from({length:100},(_,i)=>'<span style="aspect-ratio:1;background:'+(i%10<4&&i<20?'#8357c7':i%10<4?'#bed8f4':i<20?'#f5cb88':'#fff')+';border:1px solid #b2c4dd"></span>').join('')+'</div><p>100小格中，重疊紫色有8格。</p><div class="big">0.4 × 0.2 = 0.08</div>'],['小數點點放？','<div class="big">0.09 × 0.9</div><p>9 × 9 = 81</p><p>2 + 1 = 3 位小數</p><div class="big">0.081</div><div class="hint">兩個大於0、小於1的數相乘，答案比兩個數都小。</div>']],q:[['0.09 × 0.9 = ?',['0.81','0.081','8.1'],1,'9×9=81，共三位小數。'],['0.4 × 0.2 = ?',['0.08','0.8','0.06'],0,'4×2=8，共兩位小數。'],['1.2 × 0.3 = ?',['3.6','0.36','0.036'],1,'12×3=36，共兩位小數。'],['0.38 × 5 = ?',['19','0.19','1.9'],2,'38×5=190，共兩位小數。'],['1.28 × 3.7 = ?',['4.736','47.36','0.4736'],0,'128×37=4736，共三位小數。']]},
{title:'小數除法',icon:'🍕',steps:[['分成一份份','<div class="big">3 ÷ 0.5</div>'+items(6,'🍕<br>半個')+'<p>3個完整薄餅，每半個算一份，共6份。</p><div class="big">3 ÷ 0.5 = 6</div>'],['兩邊一齊搬小數點','<div class="big">0.54 ÷ 0.9</div><p>0.54 × 10；0.9 × 10</p><div class="big">5.4 ÷ 9 = 0.6</div><div class="hint">除數變整數，被除數亦要乘同一個數。</div>']],q:[['0.54 ÷ 0.9 = ?',['5','0.6','6'],1,'兩邊乘10：5.4÷9=0.6。'],['0.64 ÷ 0.4 = ?',['8','0.16','1.6'],2,'6.4÷4=1.6。'],['3 ÷ 0.5 = ?',['1.5','6','0.6'],1,'3個完整物件可分成6個半份。'],['0.1548 ÷ 0.12 = ?',['1.29','12.9','0.129'],0,'兩邊乘100：15.48÷12=1.29。'],['23 ÷ 15 保留兩位小數',['1.53','15.33','1.54'],0,'1.533…，第三位是3，捨去。']]},
{title:'循環與大小',icon:'🔁',steps:[['重複的數字','<div class="big">1.<span style="color:#b12654">103</span> 103 103 …</div><p>103不斷重複，首尾加點。</p><div class="big">1.<span class="dot">1</span>0<span class="dot">3</span></div><div class="big">3.4666… = 3.4<span class="dot">6</span></div>'],['排好小數位','<div class="big">4.666…<br>4.600…</div><p>十分位相同，百分位6大過0。</p><div class="big">4.666… ＞ 4.6</div>'],['四捨五入：望右邊一格','<div class="big">3.55<span style="background:#ffe1a4;color:#b12654">5</span>…</div><p>保留兩位小數，望第三位：5 → 進1。</p><div class="big">3.56</div>']],q:[['3.46666… 哪個數字循環？',['4','6','46'],1,'4只出現一次，6不斷重複。'],['13 ÷ 11 = ?',['1.2727…','1.1818…','1.181'],1,'13÷11=1.181818…，18循環。'],['3.555… 保留兩位小數',['3.55','3.56','3.6'],1,'第三位是5，進1。'],['4.666… 與 4.6 哪個較大？',['4.666…','4.6','一樣'],0,'百分位6大過0。'],['11 ÷ 0.6 與 11 ÷ 1.6 哪個較大？',['11 ÷ 0.6','11 ÷ 1.6','一樣'],0,'總量相同，每份越小，份數越多。']]},
{title:'代數魔法',icon:'🧩',steps:[['平方就是自己乘自己',grid(6)+'<div class="big">6² = 6 × 6 = 36</div>'],['字母是神秘數字','<div class="big">7　8　9<br>x−1　x　x+1</div><p>前一個減1，後一個加1。</p><div class="big">x × 8 × b = 8xb</div>'],['把字母換成數字','<div class="big">y = 7<br>2(y − 5)<br>= 2 × (7 − 5)<br>= 2 × 2 = 4</div><p>先計括號，再乘。</p>']],q:[['6² = ?',['12','36','6'],1,'6×6=36。'],['中間是 x，前一個是？',['3x','x−1','x+1'],1,'前一個整數比中間少1。'],['a × 8 × b 簡寫',['8ab','b÷8a','a+8+b'],0,'數字放前面，省略乘號。'],['y=7，2(y−5) = ?',['0','4','9'],1,'先算7−5，再乘2。'],['x=8，x² = ?',['16','64','8'],1,'8×8=64。']]},
{title:'乘定除？',icon:'🛒',steps:[['乘法：求總數','<p>每支筆6元，買4支，共多少元？</p>'+items(4,'🖊️<br>$6')+'<div class="big">6 + 6 + 6 + 6<br>= 6 × 4 = 24元</div><div class="hint">每份 × 份數 = 總數</div>'],['除法：求份數','<p>有24元，每支筆6元，可買多少支？</p><div class="big">💵 $24</div>'+items(4,'🖊️<br>$6')+'<div class="big">24 ÷ 6 = 4支</div><div class="hint">總數 ÷ 每份 = 份數</div>'],['除法：求每份','<p>24元平均分給4人，每人多少元？</p>'+items(4,'👧<br>$6')+'<div class="big">24 ÷ 4 = 6元</div><div class="hint">總數 ÷ 份數 = 每份</div>'],['一張圖記住三條式','<div style="max-width:280px;margin:auto;font-weight:bold"><div style="background:#ffda80;padding:12px">總數</div><div style="display:flex"><div style="flex:1;background:#d8efdf;padding:12px">每份</div><div style="flex:1;background:#dfd8fb;padding:12px">份數</div></div></div><p>找上面總數 → 乘<br>找下面其中一格 → 除</p>']],q:[['每盒有5粒糖，買3盒，共幾粒？',['5 × 3','5 ÷ 3','3 ÷ 5'],0,'知道每盒5粒、有3盒，求總數，所以乘。'],['有20粒糖，每盒放5粒，要幾盒？',['20 × 5','20 ÷ 5','5 ÷ 20'],1,'知道總數20、每盒5，求盒數，所以除。'],['20粒糖平均分給4人，每人幾粒？',['20 × 4','4 ÷ 20','20 ÷ 4'],2,'知道總數20、4人，求每份，所以除。'],['小偉a分鐘摺5顆星，每分鐘摺幾顆？',['5a','5 ÷ a','a ÷ 5'],1,'總數5顆，分成a分鐘，每分鐘是5÷a。'],['小明高1.45米，小輝是他的x倍，高多少米？',['1.45 + x','1.45 ÷ x','1.45 × x'],2,'求1.45的x倍，要乘。']]},
{title:'應用題大冒險',icon:'🏆',steps:[['文具店：錢夠先買得起','<p>有100元，每支筆6.8元，最多買多少支？</p><div class="big">100 ÷ 6.8 = 14.705…</div><p>試買14支或15支：</p><button onclick="buy(14)">買14支</button><button onclick="buy(15)">買15支</button><div id="buyresult" class="hint">撳一下，睇吓夠唔夠錢！</div><p>求份數所以用除；錢不夠不能買多一支。</p>'],['果醬工場：剩少少都要裝','<p>45.6千克果醬，每罐最多裝0.85千克，至少需要幾罐？</p><div class="big">45.6 ÷ 0.85 = 53.647…</div><div class="items"><span class="item">🫙 × 53<br>45.05 kg</span><span class="item">🫙<br>餘下0.55 kg</span></div><div class="big">53 + 1 = 54罐</div><div class="hint">求罐數所以用除；果醬要全部裝完，有餘量就要多一罐。</div>']],q:[['100元，每支筆6.8元，應先用哪條式？',['100 × 6.8','100 ÷ 6.8','6.8 ÷ 100'],1,'知道總金額和每支價錢，求支數，所以除。'],['100 ÷ 6.8 = 14.705…，最多買幾支？',['15','14.7','14'],2,'15支要102元，不夠錢；14支要95.2元。'],['45.6千克果醬，每罐0.85千克，先計？',['45.6 × 0.85','45.6 ÷ 0.85','0.85 ÷ 45.6'],1,'知道總重量和每罐容量，求罐數，所以除。'],['45.6 ÷ 0.85 = 53.647…，至少需要幾罐？',['53','54','53.65'],1,'53罐裝不完，剩下的也要一罐。'],['每包餅乾3.5元，買8包，共多少元？',['28元','11.5元','0.4375元'],0,'每份×份數=總數，3.5×8=28。']]}
];
let level=0,step=0,qi=0,answered=false,earned=new Set();try{earned=new Set(JSON.parse(localStorage.getItem('study-math-stars')||'[]'))}catch(e){}
function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.8;let v=speechSynthesis.getVoices().find(v=>/zh[-_]HK/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function buy(n){$('buyresult').innerHTML=items(n,'🖊️')+'<p>'+n+' × 6.8 = '+(n*6.8).toFixed(1)+' 元</p><b class="'+(n===14?'good':'bad')+'">'+(n===14?'夠錢！剩下4.8元。':'唔夠錢！欠2元。')+'</b>'}
function update(){$('score').textContent='⭐ '+earned.size+' / 30 題';$('progress').value=earned.size;$('nav').innerHTML=lessons.map((l,i)=>'<button class="'+(i===level?'active':'')+'" onclick="selectLevel('+i+')">'+l.icon+' '+l.title+(l.q.every((_,j)=>earned.has(i+':'+j))?' ✓':'')+'</button>').join('')}
function selectLevel(i){level=i;step=0;qi=0;answered=false;render();$('lesson').scrollIntoView({block:'start'})}
function renderLesson(){let l=lessons[level],s=l.steps[step];$('lesson').innerHTML='<span class="tag">第 '+(level+1)+' 關 · 圖解 '+(step+1)+'/'+l.steps.length+'</span><h2>'+l.icon+' '+s[0]+'</h2><div class="visual" id="visual">'+s[1]+'</div><button onclick="speak(document.querySelector(\'#lesson h2\').innerText+\'。\'+$(\'visual\').innerText)">🔊 讀出圖解</button><div><button onclick="move(-1)" '+(step===0?'disabled':'')+'>← 上一圖</button><button class="primary" onclick="move(1)">'+(step===l.steps.length-1?'去練習 ↓':'下一圖 →')+'</button></div>'}
function move(d){if(step+d>=lessons[level].steps.length){$('quiz').scrollIntoView({block:'start'});return}step=Math.max(0,step+d);renderLesson()}
function renderQuiz(){let q=lessons[level].q[qi];$('quiz').innerHTML='<span class="tag">練習 '+(qi+1)+'/5</span><h2 id="question">'+q[0]+'</h2><button onclick="speak($(\'question\').innerText)">🔊 讀題</button><div class="choices">'+q[1].map((a,i)=>'<button onclick="answer('+i+')">'+a+'</button>').join('')+'</div><p id="feedback" aria-live="polite">揀一個答案吧！</p><button id="next" hidden class="primary" onclick="next()">'+(qi===4?'完成本關 →':'下一題 →')+'</button>'}
function answer(i){if(answered)return;let q=lessons[level].q[qi];if(i===q[2]){answered=true;earned.add(level+':'+qi);try{localStorage.setItem('study-math-stars',JSON.stringify([...earned]))}catch(e){}$('feedback').innerHTML='<b class="good">⭐ 答對了！</b><br>'+q[3];$('next').hidden=false;update()}else{$('feedback').innerHTML='<b class="bad">再試一次！</b><br>'+q[3]}}
function next(){if(!answered)return;if(qi<4){qi++;answered=false;renderQuiz()}else if(level<5){selectLevel(level+1)}else{$('quiz').innerHTML='<h2>🎉 本關完成！</h2><p>你已解開 '+earned.size+' / 30 題。</p><button class="primary" onclick="selectLevel(0)">再練習</button>'}}
function render(){update();renderLesson();renderQuiz()}render();
</script></html>
